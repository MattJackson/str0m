[package]
name = "str0m-proto"
version = "0.7.0"
authors = ["Martin Algesten <martin@algesten.se>"]
description = "Internal crate for str0m. Not intended for direct use."
license = "MIT OR Apache-2.0"
repository = "https://github.com/algesten/str0m"
readme = "README.md"
edition = "2024"

# MSRV
rust-version = "1.85.0"

[features]
default = ["dtls-dimpl", "fastrand"]
dtls = ["dep:zeroize"]
dtls-dimpl = ["dtls", "dep:dimpl"]
# Draws with no fill installed (`set_fill`) fall back to fastrand; without this feature they panic.
fastrand = ["dep:fastrand"]
openssl = ["dep:openssl"]
pii = []

# When we are running in test mode
_internal_test_exports = []

[dependencies]
# Concrete DTLS engine, needed only by its adapter.
dimpl = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

time.workspace = true
base64ct.workspace = true
subtle.workspace = true
fastrand = { workspace = true, optional = true }
serde.workspace = true

# For openssl errors
openssl = { workspace = true, optional = true }
